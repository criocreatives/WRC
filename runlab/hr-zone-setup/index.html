<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR Zone Setup · RUNLAB</title><link rel="icon" type="image/png" href="../../assets/runlab/WRC Runlabfavicon.png"><link rel="stylesheet" href="../style.css"></head><body><div class="wrap"><header><a href="../"><img class="logo-sub" src="../../assets/runlab/WRC Runlab TXT orng.svg"></a></header><main><a class="backbtn" href="../">← RUNLAB</a><div class="eyebrow">RUNLAB · 02</div><h1>HR ZONE<br>SETUP.</h1><p>Calculate five heart-rate zones and copy the BPM boundaries into your running watch.</p><section class="tool"><div class="formgrid"><div><label>RESTING HEART RATE</label><select id="rest"></select></div><div><label>MAX HEART RATE</label><select id="max"></select></div><div><label>METHOD</label><select id="method"><option value="hrr">Heart Rate Reserve · Karvonen</option><option value="max">% of Max HR</option></select></div></div><p><button onclick="zones()">CALCULATE WATCH ZONES</button></p><div id="res" class="result"></div><div id="exports" class="exportbar"></div></section></main><footer><div class="footlinks"><a href="../"><img class="runlab-pill" src="../../assets/runlab/WRC Runlab TXT orng.svg" alt="RUNLAB"></a><a href="/"><img class="wrc-home" src="../../assets/logos/WRC Logo Stack.png"></a></div></footer></div><script src="../tools.js"></script><script>addExports('res','exports','RUNLAB-HR-Zones');fill('rest',30,120,55);fill('max',100,230,195);function zones(){let R=+rest.value,M=+max.value,md=method.value,B=[[.5,.6],[.6,.7],[.7,.8],[.8,.9],[.9,1]],N=['Recovery','Easy / aerobic','Steady','Threshold','High intensity'],U=['Warm-ups, cool-downs and active recovery.','Build aerobic endurance; the main zone for easy runs and comfortable mileage.','Moderate sustained running for aerobic strength without full threshold intensity.','Hard, controlled tempo and threshold work to improve sustained speed.','Very hard short intervals and VO₂-focused work; normally used in limited doses.'];res.innerHTML='<div class=eyebrow>RUNLAB · WATCH SETTINGS</div><h2>YOUR HEART RATE ZONES</h2>'+B.map((b,i)=>{let lo=md==='hrr'?R+(M-R)*b[0]:M*b[0],hi=md==='hrr'?R+(M-R)*b[1]:M*b[1];return '<div class=zone><b>ZONE '+(i+1)+'</b><span><strong>'+N[i]+'</strong><small>'+U[i]+'</small></span><strong>'+Math.round(lo)+'–'+Math.round(hi)+' bpm</strong></div>'}).join('');res.classList.add('on')}</script></body></html>
