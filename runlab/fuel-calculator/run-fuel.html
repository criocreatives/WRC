<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run Fuel · RUNLAB</title><link rel="icon" type="image/png" href="../../assets/runlab/WRC Runlabfavicon.png"><link rel="stylesheet" href="../style.css"></head><body><div class="wrap"><header><a href="../"><img class="logo-sub" src="../../assets/runlab/WRC Runlab TXT orng.svg" alt="RUNLAB"></a></header><main><a class="backbtn" href="./">← FUEL CALCULATOR</a><div class="eyebrow">FUEL CALCULATOR · RUN</div><h1>RUN<br>FUEL.</h1><p>Get a timed carbohydrate plan for a 10K, half marathon or marathon. Practice the same products and timing in training before race day.</p><section class="tool"><div class="formgrid"><div><label>DISTANCE</label><div class="choice"><input id="d10" type="radio" name="dist" value="10" checked><label for="d10">10K</label><input id="dh" type="radio" name="dist" value="21.0975"><label for="dh">HALF</label><input id="dm" type="radio" name="dist" value="42.195"><label for="dm">MARATHON</label></div></div><div><label>EXPECTED FINISH TIME</label><div id="rt"></div></div><div><label>WEIGHT · LB</label><div class="sliderbox"><div class="sliderhead"><span>70 — 350 LB</span><b id="wtOut"></b></div><input id="wt" type="range" min="70" max="350" value="180"></div></div></div><p><button onclick="calc()">BUILD FUEL PLAN</button></p><div id="res" class="result"></div><div id="exports" class="exportbar"></div></section></main><footer><div class="footlinks"><a href="../"><img class="runlab-pill" src="../../assets/runlab/WRC Runlab TXT orng.svg" alt="RUNLAB"></a><a href="/"><img class="wrc-home" src="../../assets/logos/WRC Logo Stack.png" alt="WRC Home"></a></div></footer></div><script src="../tools.js"></script><script>rt.innerHTML=tp('r');bindRange('wt','wtOut',' LB');addExports('res','exports','RUNLAB-Run-Fuel');function calc(){let h=time('r')/3600,w=+wt.value*.453592;if(h<=0)return alert('Choose an expected finish time.');let during=h<1?0:h<2.5?45:65,pre=Math.round(w*(h>2?2.5:2)),total=Math.round(during*h),gels=during?Math.max(1,Math.ceil(total/25)):0,interval=during?Math.max(20,Math.round((h*60)/gels)):0;let mid=during?'<div class=fuelstep><b>10–15 min before start</b><small>If practiced and tolerated, take ~20–25 g carbohydrate with water.</small></div><div class=fuelstep><b>First fuel: '+Math.min(30,interval)+' min into the run</b><small>Take ~20–25 g carbohydrate. Do not wait until you feel depleted.</small></div><div class=fuelstep><b>Then every ~'+interval+' min</b><small>Repeat ~20–25 g carbohydrate to average about '+during+' g/hour. Take gels with water unless the product directs otherwise.</small></div>':'<div class=fuelstep><b>During the run</b><small>For a sub-hour effort, mid-run carbohydrate is usually optional if you start well fueled.</small></div>';res.innerHTML='<h2>YOUR RUN FUEL TIMELINE</h2><div class=stats><div class=stat><small>PRE-RUN CARBS</small><b>~'+pre+' g</b></div><div class=stat><small>DURING TARGET</small><b>'+(during?during+' g/hr':'Optional')+'</b></div><div class=stat><small>~25G SERVINGS</small><b>'+(during?'~'+gels:'0')+'</b></div></div><div class=fuelsteps><div class=fuelstep><b>2–3 hours before start</b><small>Eat ~'+pre+' g carbohydrate from familiar, lower-fiber/lower-fat foods.</small></div>'+mid+'<div class=fuelstep><b>Immediately after</b><small>Start rehydrating and eat a normal recovery meal with carbohydrate plus protein when practical.</small></div></div><div class=note>Practice this in training first. Heat, humidity, sweat rate, product concentration and GI tolerance change what works.</div>';res.classList.add('on')}</script></body></html>
