<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run Fuel · RUNLAB</title><link rel="stylesheet" href="../style.css"></head><body><div class="wrap"><header><a href="../"><img class="logo-sub" src="../../assets/runlab/WRC Runlab TXT orng.svg"></a></header><main><div class="eyebrow">FUEL CALCULATOR · RUN</div><h1>RUN<br>FUEL.</h1><p>Build a practical starting strategy for a 10K, half marathon or marathon.</p><section class="tool"><div class="formgrid"><div><label>DISTANCE</label><select id="dist"><option value="10">10K</option><option value="21.0975">Half Marathon</option><option value="42.195">Marathon</option></select></div><div><label>EXPECTED FINISH TIME</label><div id="rt"></div></div><div><label>WEIGHT · LB</label><select id="wt"></select></div></div><p><button onclick="calc()">BUILD FUEL PLAN</button></p><div id="res" class="result"></div></section></main><footer><div class="footlinks"><a href="../"><img class="runlab-pill" src="../../assets/runlab/WRC Runlab PILL orng.svg"></a><a href="/"><img class="wrc-home" src="../../assets/logos/WRC Logo Stack.png"></a></div></footer></div><script src="../tools.js"></script><script>rt.innerHTML=tp('r');fill('wt',70,500,180);function calc(){let h=time('r')/3600,w=+wt.value*.453592;if(h<=0)return alert('Choose an expected finish time.');let during=h<1?0:h<2.5?45:65,pre=Math.round(w*(h>2?2.5:2)),total=Math.round(during*h),gels=during?Math.max(1,Math.ceil(total/25)):0;res.innerHTML='<h2>YOUR STARTING FUEL PLAN</h2><div class=stats><div class=stat><small>PRE-RUN CARBS</small><b>~'+pre+' g</b></div><div class=stat><small>DURING-RUN CARBS</small><b>'+(during?during+' g/hr':'Usually optional')+'</b></div><div class=stat><small>GELS · ~25G EACH</small><b>'+(during?'~'+gels:'0')+'</b></div></div><div class=note><b>Before:</b> Aim for the pre-run carbohydrate target roughly 2–3 hours before the start using familiar foods.</div><div class=note><b>During:</b> '+(during?'Spread carbohydrate progressively across the run and practice the strategy in training.':'For an event under about an hour, mid-run carbohydrate is often optional if you start well fueled.')+'</div><div class=note>Heat, humidity, sweat rate and GI tolerance can materially change fueling needs.</div>';res.classList.add('on')}</script></body></html>
