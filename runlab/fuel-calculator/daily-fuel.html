<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Fuel · RUNLAB</title><link rel="stylesheet" href="../style.css"></head><body><div class="wrap"><header><a href="../"><img class="logo-sub" src="../../assets/runlab/WRC Runlab TXT orng.svg"></a></header><main><div class="eyebrow">FUEL CALCULATOR · DAILY</div><h1>DAILY<br>FUEL.</h1><section class="tool"><div class="formgrid"><div><label>SEX</label><select id="sex"><option value="m">Male</option><option value="f">Female</option></select></div><div><label>AGE</label><select id="age"></select></div><div><label>WEIGHT · LB</label><select id="wt"></select></div><div><label>HEIGHT · FEET</label><select id="ft"></select></div><div><label>HEIGHT · INCHES</label><select id="inch"></select></div><div><label>NON-RUN ACTIVITY</label><select id="act"><option value="1.2">Mostly sedentary</option><option value="1.35" selected>Lightly active</option><option value="1.5">Active</option></select></div><div><label>RUNNING · KM / WEEK</label><select id="rkm"></select></div><div><label>GOAL</label><select id="goal"><option value="-300">Lose gradually</option><option value="0" selected>Maintain</option><option value="250">Gain gradually</option></select></div></div><p><button onclick="calc()">CALCULATE DAILY FUEL</button></p><div id="res" class="result"></div></section></main><footer><div class="footlinks"><a href="../"><img class="runlab-pill" src="../../assets/runlab/WRC Runlab PILL orng.svg"></a><a href="/"><img class="wrc-home" src="../../assets/logos/WRC Logo Stack.png"></a></div></footer></div><script src="../tools.js"></script><script>fill('age',13,100,30);fill('wt',70,500,180);fill('ft',4,7,5);fill('inch',0,11,10);fill('rkm',0,250,20);function calc(){let w=+wt.value*.453592,h=(+ft.value*12 + +inch.value)*2.54,a=+age.value,b=10*w+6.25*h-5*a+(sex.value==='m'?5:-161),m=b*(+act.value)+w*(+rkm.value)/7,t=m+(+goal.value),pr=w*(+goal.value<0?1.9:1.7),fat=w*.8,car=Math.max(0,(t-pr*4-fat*9)/4);res.innerHTML='<div class=stats><div class=stat><small>DAILY TARGET</small><b>'+Math.round(t/10)*10+' kcal</b></div><div class=stat><small>MAINTENANCE</small><b>'+Math.round(m)+' kcal</b></div><div class=stat><small>BMR</small><b>'+Math.round(b)+' kcal</b></div></div><div class=stats><div class=stat><small>PROTEIN</small><b>'+Math.round(pr)+' g</b></div><div class=stat><small>FAT</small><b>'+Math.round(fat)+' g</b></div><div class=stat><small>CARBS</small><b>'+Math.round(car)+' g</b></div></div>';res.classList.add('on')}</script></body></html>
