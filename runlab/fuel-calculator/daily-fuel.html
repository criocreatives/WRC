<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Fuel · RUNLAB</title><link rel="icon" type="image/png" href="../../assets/runlab/WRC Runlabfavicon.png"><link rel="stylesheet" href="../style.css"></head><body><div class="wrap"><header><a href="../"><img class="logo-sub" src="../../assets/runlab/WRC Runlab TXT orng.svg"></a></header><main><a class="backbtn" href="./">← FUEL CALCULATOR</a><div class="eyebrow">FUEL CALCULATOR · DAILY</div><h1>DAILY<br>FUEL.</h1><section class="tool"><div class="formgrid"><div><label>SEX</label><div class="segment"><input id="sm" type="radio" name="sexpick" value="m" checked><label for="sm">MALE</label><input id="sf" type="radio" name="sexpick" value="f"><label for="sf">FEMALE</label></div></div><div><label>AGE</label><div class="sliderbox"><div class="sliderhead"><span>13 — 100</span><b class="rangevalue" id="ageOut">30</b></div><input id="age" type="range" min="13" max="100" value="30"></div></div><div><label>WEIGHT · LB</label><div class="sliderbox"><div class="sliderhead"><span>70 — 500 LB</span><b class="rangevalue" id="wtOut">180 LB</b></div><input id="wt" type="range" min="70" max="500" value="180"></div></div><div><label>HEIGHT</label><div class="timepick"><div><select id="ft"><option>4</option><option selected>5</option><option>6</option><option>7</option></select><small>FEET</small></div><div><select id="inch"></select><small>INCHES</small></div></div></div><div><label>NON-RUN ACTIVITY</label><div class="segment"><input id="a1" type="radio" name="actpick" value="1.2"><label for="a1">LOW</label><input id="a2" type="radio" name="actpick" value="1.35" checked><label for="a2">LIGHT</label><input id="a3" type="radio" name="actpick" value="1.5"><label for="a3">ACTIVE</label></div></div><div><label>RUNNING · KM / WEEK</label><div class="sliderbox"><div class="sliderhead"><span>0 — 250 KM</span><b class="rangevalue" id="rkmOut">20 KM</b></div><input id="rkm" type="range" min="0" max="250" value="20"></div></div><div><label>GOAL</label><div class="segment"><input id="gl" type="radio" name="goalpick" value="-300"><label for="gl">LOSE</label><input id="gm" type="radio" name="goalpick" value="0" checked><label for="gm">MAINTAIN</label><input id="gg" type="radio" name="goalpick" value="250"><label for="gg">GAIN</label></div></div></div><p><button onclick="calc()">CALCULATE DAILY FUEL</button></p><div id="res" class="result"></div><div id="exports" class="exportbar"></div></section></main><footer><div class="footlinks"><a href="../"><img class="runlab-pill" src="../../assets/runlab/WRC Runlab TXT orng.svg" alt="RUNLAB"></a><a href="/"><img class="wrc-home" src="../../assets/logos/WRC Logo Stack.png"></a></div></footer></div><script src="../tools.js"></script><script>addExports('res','exports','RUNLAB-Daily-Fuel');fill('inch',0,11,10);bindRange('age','ageOut','');bindRange('wt','wtOut',' LB');bindRange('rkm','rkmOut',' KM');function calc(){let w=+wt.value*.453592,h=(+ft.value*12 + +inch.value)*2.54,a=+age.value,sx=document.querySelector('input[name=sexpick]:checked').value,activity=+document.querySelector('input[name=actpick]:checked').value,goalv=+document.querySelector('input[name=goalpick]:checked').value,b=10*w+6.25*h-5*a+(sx==='m'?5:-161),m=b*activity+w*(+rkm.value)/7,t=m+goalv,pr=w*(goalv<0?1.9:1.7),fat=w*.8,car=Math.max(0,(t-pr*4-fat*9)/4);res.innerHTML='<div class=stats><div class=stat><small>DAILY TARGET</small><b>'+Math.round(t/10)*10+' kcal</b></div><div class=stat><small>MAINTENANCE</small><b>'+Math.round(m)+' kcal</b></div><div class=stat><small>BMR</small><b>'+Math.round(b)+' kcal</b></div></div><div class=stats><div class=stat><small>PROTEIN</small><b>'+Math.round(pr)+' g</b></div><div class=stat><small>FAT</small><b>'+Math.round(fat)+' g</b></div><div class=stat><small>CARBS</small><b>'+Math.round(car)+' g</b></div></div>';res.classList.add('on')}</script>
