<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Plan · RUNLAB</title><link rel="icon" type="image/png" href="../../assets/runlab/WRC Runlabfavicon.png"><link rel="stylesheet" href="../style.css"></head><body><div class="wrap"><header><a href="../"><img class="logo-sub" src="../../assets/runlab/WRC Runlab TXT orng.svg" alt="RUNLAB"></a></header><main><a class="backbtn" href="../">← RUNLAB</a><div class="eyebrow">RUNLAB · 01</div><h1>TRAINING<br>PLAN.</h1><p>Build a race plan around your current fitness, weekly running and race date.</p><section class="tool"><div class="formgrid"><div><label>TARGET RACE</label><div class="choice"><input id="t5" type="radio" name="target" value="5" checked><label for="t5">5K</label><input id="t10" type="radio" name="target" value="10"><label for="t10">10K</label><input id="th" type="radio" name="target" value="21.0975"><label for="th">HALF</label><input id="tm" type="radio" name="target" value="42.195"><label for="tm">MARATHON</label></div></div><div><label>RACE DATE</label><div class="datebox"><input id="date" type="date"></div></div><div><label>RECENT RACE / BENCHMARK</label><div class="choice"><input id="bn" type="radio" name="bench" value="none"><label for="bn">NONE</label><input id="b3" type="radio" name="bench" value="3"><label for="b3">3K</label><input id="b5" type="radio" name="bench" value="5" checked><label for="b5">5K</label><input id="b10" type="radio" name="bench" value="10"><label for="b10">10K</label></div></div><div><label>BENCHMARK TIME</label><div id="bt"></div></div><div><label>RUNS / WEEK</label><div class="sliderbox"><div class="sliderhead"><span>1 — 7</span><b id="daysOut"></b></div><input id="days" type="range" min="1" max="7" value="3"></div></div><div><label>KM / WEEK</label><div class="sliderbox"><div class="sliderhead"><span>0 — 200 KM</span><b id="kmOut"></b></div><input id="km" type="range" min="0" max="200" value="15"></div></div><div><label>LONGEST RECENT RUN</label><div class="sliderbox"><div class="sliderhead"><span>0 — 50 KM</span><b id="longOut"></b></div><input id="long" type="range" min="0" max="50" step=".5" value="7"></div></div></div><p><button onclick="build()">BUILD MY PLAN</button></p><div id="res" class="result"></div><div id="exports" class="exportbar"></div></section></main><footer><div class="footlinks"><a href="../"><img class="runlab-pill" src="../../assets/runlab/WRC Runlab TXT orng.svg" alt="RUNLAB"></a><a href="/"><img class="wrc-home" src="../../assets/logos/WRC Logo Stack.png" alt="WRC Home"></a></div></footer></div><script src="../tools.js"></script><script>bt.innerHTML=tp('b');bindRange('days','daysOut',' / WK');bindRange('km','kmOut',' KM');bindRange('long','longOut',' KM');addExports('res','exports','RUNLAB-Training-Plan');let d=new Date();d.setDate(d.getDate()+56);date.value=d.toISOString().slice(0,10);function target(){return +document.querySelector('input[name=target]:checked').value}function build(){let rd=new Date(date.value+'T12:00:00'),W=Math.floor((rd-new Date())/604800000),D=+days.value,K=+km.value,L=+long.value,T=target();if(W<1)return alert('Choose a future race date.');W=Math.min(32,W);let maxLong=T>=42?32:T>20?22:T===10?14:11,h='<div class=stats><div class=stat><small>TRAINING WINDOW</small><b>'+W+' weeks</b></div><div class=stat><small>RUNS</small><b>'+D+'/week</b></div><div class=stat><small>STARTING VOLUME</small><b>'+K+' km</b></div></div>';for(let w=1;w<=W;w++){let race=w===W,taper=!race&&w>=W-2,rec=w%4===0&&!taper&&!race,vol=K*Math.min(1.4,1+(w-1)*.035);if(rec)vol*=.82;if(taper)vol*=.78;if(race)vol*=.55;let lr=Math.min(maxLong,Math.max(L,L+(w-1)*(T>=42?1:T>20?.7:.4)));if(taper)lr*=.75;if(race)lr=T;let a=D===1?['Long easy · '+lr.toFixed(1)+' km]:D===2?['Easy aerobic','Long easy · '+lr.toFixed(1)+' km]:['Quality · '+(race?'Short controlled strides':'tempo / intervals'),'Easy aerobic','Long easy · '+lr.toFixed(1)+' km'];for(let x=3;x<D;x++)a.splice(a.length-1,0,'Easy / recovery run');h+='<div class=week><h3>WEEK '+w+' · '+(race?'RACE WEEK':taper?'TAPER':rec?'RECOVERY':'BUILD')+'</h3><p>Target volume ~'+Math.round(vol)+' km</p>'+a.map(s=>'<div class=run>'+s+'</div>').join('')+'</div>'}res.innerHTML=h;res.classList.add('on')}</script></body></html>
