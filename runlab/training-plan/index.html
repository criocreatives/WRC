<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Plan · RUNLAB</title><link rel="stylesheet" href="../style.css"></head><body><div class="wrap"><header><a href="../"><img class="logo-sub" src="../../assets/runlab/WRC Runlab TXT orng.svg"></a></header><main><div class="eyebrow">RUNLAB · 01</div><h1>TRAINING<br>PLAN.</h1><p>Build a race plan from your recent benchmark, weekly running, longest run and race date.</p><section class="tool"><div class="formgrid"><div><label>TARGET RACE</label><select id="target"><option value="5">5K</option><option value="10">10K</option><option value="21.0975">Half Marathon</option></select></div><div><label>RACE DATE</label><input id="date" type="date"></div><div><label>RECENT RACE / BENCHMARK</label><select id="bench"><option value="none">No recent time</option><option value="3">3K</option><option value="5" selected>5K</option><option value="10">10K</option><option value="21.0975">Half Marathon</option></select></div><div><label>BENCHMARK TIME</label><div id="bt"></div></div><div><label>RUNS / WEEK</label><select id="days"></select></div><div><label>KM / WEEK</label><select id="km"></select></div><div><label>LONGEST RECENT RUN · KM</label><select id="long"></select></div></div><p><button onclick="build()">BUILD MY PLAN</button></p><div id="res" class="result"></div></section></main><footer><div class="footlinks"><a href="../"><img class="runlab-pill" src="../../assets/runlab/WRC Runlab PILL orng.svg"></a><a href="/"><img class="wrc-home" src="../../assets/logos/WRC Logo Stack.png"></a></div></footer></div><script src="../tools.js"></script><script>bt.innerHTML=tp('b');fill('days',1,7,3);fill('km',0,200,15);fill('long',0,50,7);let d=new Date();d.setDate(d.getDate()+56);date.value=d.toISOString().slice(0,10);function build(){let rd=new Date(date.value+'T12:00:00'),W=Math.floor((rd-new Date())/604800000),D=+days.value,K=+km.value,L=+long.value;if(W<1)return alert('Choose a future race date.');W=Math.min(24,W);let h='<div class=stats><div class=stat><small>TRAINING WINDOW</small><b>'+W+' weeks</b></div><div class=stat><small>RUNS</small><b>'+D+'/week</b></div><div class=stat><small>STARTING VOLUME</small><b>'+K+' km</b></div></div>';for(let w=1;w<=W;w++){let rec=w%4===0&&w<W-1,taper=w===W,vol=K*Math.min(1.32,1+(w-1)*.04);if(rec)vol*=.82;if(taper)vol*=.62;let lr=Math.min(+target.value>20?20:+target.value===10?13:10,L*(1+(w-1)*.05));h+='<div class=week><h3>WEEK '+w+' · '+(taper?'RACE WEEK':rec?'RECOVERY':'BUILD')+'</h3><p>Target volume ~'+vol.toFixed(0)+' km</p><div class=run><b>QUALITY</b><br>'+(taper?'4 × 400 m controlled':'Race-specific quality session')+'</div><div class=run><b>EASY</b><br>Easy aerobic running</div><div class=run><b>LONG</b><br>Long easy · '+lr.toFixed(1)+' km</div></div>'}res.innerHTML=h;res.classList.add('on')}</script></body></html>
