lue="0">00</option><option value="1">01</option><option value="2">02</option><option value="3">03</option><option value="4">04</option><option value="5">05</option><option value="6">06</option><option value="7">07</option><option value="8">08</option><option value="9">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option><option value="57">57</option><option value="58">58</option><option value="59">59</option></select><small>MIN</small></div><div><select id="tss"><option value="0">00</option><option value="1">01</option><option value="2">02</option><option value="3">03</option><option value="4">04</option><option value="5">05</option><option value="6">06</option><option value="7">07</option><option value="8">08</option><option value="9">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option><option value="57">57</option><option value="58">58</option><option value="59">59</option></select><small>SEC</small></div></div><small style="display:block;margin-top:7px;color:#8f9496">Leave at 00:00:00 for no time goal.</small></div><div><label>RUNS / WEEK</label><div class="sliderbox"><div class="sliderhead"><span>1 — 7</span><b class="rangevalue" id="daysOut">3 / WK</b></div><input id="days" type="range" min="1" max="7" value="3"></div></div><div><label>KM / WEEK</label><div class="sliderbox"><div class="sliderhead"><span>0 — 200 KM</span><b class="rangevalue" id="kmOut">15 KM</b></div><input id="km" type="range" min="0" max="200" value="15"></div></div><div><label>LONGEST RECENT RUN</label><div class="sliderbox"><div class="sliderhead"><span>0 — 50 KM</span><b class="rangevalue" id="longOut">7 KM</b></div><input id="long" type="range" min="0" max="50" step=".5" value="7"></div></div></div><p><button id="buildPlanBtn" type="button">BUILD MY PLAN</button></p><div id="res" class="result"></div><div id="exports" class="exportbar"></div></section></main><footer><div class="footlinks"><a href="../"><img class="runlab-pill" src="../../assets/runlab/WRC Runlab TXT orng.svg" alt="RUNLAB"></a><a href="/"><img class="wrc-home" src="../../assets/logos/WRC Logo Stack.png" alt="WRC Home"></a></div></footer></div><script>
(function(){
const $=id=>document.getElementById(id);
function wireRange(id,out,suffix){const el=$(id),label=$(out);const update=()=>{label.textContent=el.value+suffix};el.addEventListener('input',update,{passive:true});el.addEventListener('change',update);update()}
wireRange('days','daysOut',' / WK');wireRange('km','kmOut',' KM');wireRange('long','longOut',' KM');
const dateEl=$('date');if(!dateEl.value){const d=new Date();d.setDate(d.getDate()+56);dateEl.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function syncBenchmark(){const b=document.querySelector('input[name="bench"]:checked');$('benchmarkTimeField').style.display=b&&b.value==='none'?'none':'block'}
document.querySelectorAll('input[name="bench"]').forEach(el=>el.addEventListener('change',syncBenchmark));syncBenchmark();
function buildPlan(){
 const rd=new Date(dateEl.value+'T12:00:00'), now=new Date();now.setHours(0,0,0,0);
 let W=Math.ceil((rd-now)/604800000),D=Number($('days').value),K=Number($('km').value),L=Number($('long').value);
 const t=document.querySelector('input[name="target"]:checked');const T=t?Number(t.value):5;
 if(!dateEl.value||isNaN(rd.getTime())||rd<=now){alert('Choose a race date after today.');return}
 W=Math.min(32,Math.max(1,W));
 const maxLong=T>=42?32:T>20?22:T===10?14:11;
 let h='<div class="stats"><div class="stat"><small>TRAINING WINDOW</small><b>'+W+' weeks</b></div><div class="stat"><small>RUNS</small><b>'+D+'/week</b></div><div class="stat"><small>STARTING VOLUME</small><b>'+K+' km</b></div></div>';
 for(let w=1;w<=W;w++){
  const race=w===W,taper=!race&&w>=W-2,rec=w%4===0&&!taper&&!race;
  let vol=K*Math.min(1.4,1+(w-1)*.035);if(rec)vol*=.82;if(taper)vol*=.78;if(race)vol*=.55;
  let lr=Math.min(maxLong,Math.max(L,L+(w-1)*(T>=42?1:T>20?.7:.4)));if(taper)lr*=.75;if(race)lr=T;
  let a=D===1?['Long easy · '+lr.toFixed(1)+' km']:D===2?['Easy aerobic','Long easy · '+lr.toFixed(1)+' km']:['Quality · '+(race?'Short controlled strides':'tempo / intervals'),'Easy aerobic','Long easy · '+lr.toFixed(1)+' km'];
  for(let x=3;x<D;x++)a.splice(a.length-1,0,'Easy / recovery run');
  h+='<div class="week"><h3>WEEK '+w+' · '+(race?'RACE WEEK':taper?'TAPER':rec?'RECOVERY':'BUILD')+'</h3><p>Target volume ~'+Math.round(vol)+' km</p>'+a.map(v=>'<div class="run">'+v+'</div>').join('')+'</div>';
 }
 $('res').innerHTML=h;$('res').classList.add('on');$('res').scrollIntoView({behavior:'smooth',block:'start'});
}
$('buildPlanBtn').addEventListener('click',buildPlan);
})();
</script>
